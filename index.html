<h1 style="margin: 0.0px 0.0px 4.0px 0.0px; text-align: center; font: 22.0px 'Hiragino Sans'; color: #ffffff; -webkit-text-stroke: #ffffff"><span class="s1">訪問アラーム設定</span></h1>
<p class="p2"><span class="s1">開始時刻をタップして複数選択できます</span></p>
<p class="p3"><span class="s1">終了前の通知</span></p>
<p class="p4"><span class="s2">1</span><span class="s1">分前</span><span class="s2">2</span><span class="s1">分前</span><span class="s2">3</span><span class="s1">分前</span><span class="s2">4</span><span class="s1">分前</span><span class="s2">5</span><span class="s1">分前</span></p>
<p class="p5"><span class="s1">アラーム</span><span class="s3">ON</span></p>
<p class="p6"><span class="s3">0</span><span class="s1">件選択</span></p>
<p class="p7"><span class="s4">選択内容</span></p>
<p class="p8"><span class="s1">すべて解除</span></p>
<p class="p9"><span class="s4">時刻を選択してください</span></p>
<p class="p10"><span class="s1"></span><br></p>
<p class="p11"><span class="s1">開始時刻と終了前の時刻を、</span><span class="s3">iPhone</span><span class="s1">の既存アラームから探して</span><span class="s3">ON</span><span class="s1">にします。時計アプリに該当時刻のアラームがない場合、その時刻は</span><span class="s3">ON</span><span class="s1">にできません。ショートカット「訪問アラーム設定」が必要です。</span></p>
